<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#EB0401" />
    <title>Page Not Found | Example Diagnostics Lab</title>
    <!--
      Deliberately no <link rel="canonical"> here — this is served by Nginx
      with a real HTTP 404 status for any URL that matches no real page and
      no known app route (see your web server's `error_page 404` config),
      so it must never look like indexable content: no canonical, no
      homepage copy, `noindex` above, and its own distinct title.
    -->
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #f8f8f8;
        color: #1a1a1a;
        text-align: center;
      }
      .wrap {
        max-width: 420px;
      }
      .brand {
        font-size: 20px;
        font-weight: 800;
        color: #eb0401;
        letter-spacing: -0.01em;
        margin-bottom: 32px;
      }
      .code {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        color: #eb0401;
        margin: 0;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 16px 0 8px;
      }
      p {
        font-size: 14px;
        color: #6b6b6b;
        margin: 0 0 28px;
        line-height: 1.5;
      }
      a.home {
        display: inline-block;
        background: #eb0401;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 999px;
      }
      a.home:hover {
        opacity: 0.92;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">Example Diagnostics Lab</p>
      <p class="code">404</p>
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist or may have moved.</p>
      <a class="home" href="/">Back to Home</a>
    </div>
  </body>
</html>
